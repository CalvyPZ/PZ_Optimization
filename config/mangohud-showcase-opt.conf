### MangoHud profile for the quad-view showcase (opt runs): detailed HUD hugging the
### left screen edge so that, in the side-by-side composite (stock left, optimized
### right), the two overlays meet at the centre. Values change colour with load:
### GPU/CPU load green <60%, yellow 60-90%, red >90%; FPS red <100, yellow 100-160,
### green >160 (the ms frame-time figure is the same metric; MangoHud has no separate
### threshold colouring for it).
### harness/run.sh --label NAME --record --mangohud-config config/mangohud-showcase-opt.conf
fps_limit=0
gpu_list=0
legacy_layout=false
font_size=64
font_size_text=56
background_alpha=0.65
round_corners=12
table_columns=3
position=top-left
offset_x=48
offset_y=560
text_outline

gpu_stats
gpu_temp
gpu_core_clock
gpu_power
gpu_load_change
gpu_load_value=60,90
gpu_load_color=39F900,FDFD09,B22222
vram
cpu_stats
cpu_temp
cpu_mhz
cpu_load_change
cpu_load_value=60,90
cpu_load_color=39F900,FDFD09,B22222
ram
fps
fps_color_change
fps_value=100,160
fps_color=B22222,FDFD09,39F900
frametime
fps_metrics=avg,0.01,0.001
frame_timing
frame_timing_detailed
dynamic_frame_timing
engine_version
resolution
display_server
time

log_versioning
benchmark_percentiles=99,AVG,1,0.1
output_folder=./harness-mangohud
autostart_log=2
log_duration=0
log_interval=0
