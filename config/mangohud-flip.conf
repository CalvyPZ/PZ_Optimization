### MangoHud profile for on-screen runs on the Flip 1S (1920x1080, AMD APU on battery):
### the showcase layout scaled to 1080p, with battery draw. CSV logging as in the other profiles.
### harness/run.sh --label NAME --mangohud-config config/mangohud-flip.conf
fps_limit=0
gpu_list=0
legacy_layout=false
font_size=26
font_size_text=22
background_alpha=0.65
round_corners=8
table_columns=3
position=top-left
text_outline

gpu_stats
gpu_temp
gpu_core_clock
gpu_power
vram
cpu_stats
cpu_temp
cpu_mhz
cpu_power
ram
battery
battery_watt
battery_time
fps
frametime
fps_metrics=avg,0.01,0.001
frame_timing
frame_timing_detailed
histogram
engine_version
resolution
display_server
time

log_versioning
benchmark_percentiles=99,AVG,1,0.1
output_folder=./harness-mangohud
autostart_log=2
log_duration=0
log_interval=0
