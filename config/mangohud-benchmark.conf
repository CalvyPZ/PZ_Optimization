### MangoHud profile for repeatable benchmark runs.
### Use with:
###   harness/run.sh --label NAME --mangohud SECONDS \
###     --mangohud-config config/mangohud-benchmark.conf
###
### This deliberately favors complete telemetry over a compact on-screen HUD.
### The CSV log is the authoritative output used by harness/analyze.py.

# Keep benchmark runs uncapped by MangoHud itself.
fps_limit=0

# No overlay: drawing the HUD costs frame time of its own; the CSV is what matters.
no_display

# Enable the complete standard telemetry set.
full
gpu_name
gpu_stats
gpu_temp
gpu_junction_temp
gpu_core_clock
gpu_mem_clock
gpu_mem_temp
gpu_power
gpu_power_limit
gpu_fan
gpu_voltage
gpu_efficiency
vram
throttling_status
throttling_status_graph

cpu_stats
cpu_temp
cpu_power
cpu_mhz
cpu_efficiency
core_load
core_load_change
core_bars
core_type

io_read
io_write
ram
swap
procmem
procmem_shared
procmem_virt
proc_vram

fps
frametime
frame_timing
frame_timing_detailed
dynamic_frame_timing
histogram
fps_metrics=avg,0.01,0.001

engine_version
gpu_name
vulkan_driver
wine
arch
exec_name
winesync
present_mode
resolution
refresh_rate
display_server
gamemode
vkbasalt
version
time

# Include versioned metadata in the CSV and retain useful benchmark percentiles.
log_versioning
benchmark_percentiles=99,AVG,1,0.1

# The harness overrides these per run when --mangohud is supplied.
output_folder=./harness-mangohud
autostart_log=2
log_duration=0
log_interval=0

# Keep the overlay readable while exposing all selected values.
table_columns=3
position=top-left
text_outline
