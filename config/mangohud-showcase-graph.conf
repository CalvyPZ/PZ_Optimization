### MangoHud profile for showcase recordings: large HUD mid-screen with the detailed frame-time line graph (no histogram).
### harness/run.sh --label NAME --record --mangohud-config config/mangohud-showcase.conf
fps_limit=0
gpu_list=0
legacy_layout=false
font_size=64
font_size_text=56
background_alpha=0.65
round_corners=12
table_columns=3
position=top-center
offset_y=560
text_outline

gpu_stats
gpu_temp
gpu_core_clock
gpu_power
vram
cpu_stats
cpu_temp
cpu_mhz
ram
fps
frametime
fps_metrics=avg,0.01,0.001
frame_timing
frame_timing_detailed
dynamic_frame_timing
engine_version
resolution
display_server
time

log_versioning
benchmark_percentiles=99,AVG,1,0.1
output_folder=./harness-mangohud
autostart_log=2
log_duration=0
log_interval=0
