# Machines the run queue (harness/queue.sh) routes jobs to. One [section] per machine; the section
# name is what `submit --machine <name>` and the session affinity use. Keys:
#   local=true        this computer (no ssh; the worker runs harness/run.sh here)
#   host=user@addr    ssh target (port= when not 22); key= the identity file (~ expanded); repo= the checkout on that machine
#                     (~ relative to the remote home), os=linux|mac
#   pz_root=          PZ_ROOT for scripts/run.sh there (the Steam library's ProjectZomboid dir)
#   run_args=         appended to every harness/run.sh call there (launcher, PRIME env, ...)
#   runner=           the run script there (default harness/run.sh, mac: harness/run-mac.sh)
#   display_env=      linux: read DISPLAY/WAYLAND_DISPLAY/XAUTHORITY/DBUS/XDG_* from this process's environ
#                     (the game needs the desktop session's display; ssh has none)
#   inhibit=true      hold org.freedesktop.ScreenSaver + PowerManagement inhibits and unlock the session
#                     before the run (a machine that suspends / locks when idle)
#   steam_shutdown=true   `steam -shutdown` before the run (a resident Steam client halves the Dell's numbers)
#   install=install.sh    how --install opt puts build/classes there: install.sh (JDK-free `./install.sh --from
#                     build/classes --dir <game dir>`), pzopt.sh (`scripts/pzopt.sh reinstall`, needs a JDK),
#                     run-mac.sh (`harness/run-mac.sh install build/classes`)
#   game_dir=         the game dir install.sh --dir needs (mac: <app>/Contents/Java)
# The multiplayer (mp) and workshop jobs only run on the local machine (the stock server and the Steam
# upload live here).

[desktop]
local=true

[flip]
# Ayaneo Flip / diego-flip: Ryzen AI 9 HX 370, Radeon 890M (Mesa), KDE Wayland 1920x1080, fish shell
host=diego@192.168.0.82
key=~/.ssh/id_ed25519_pzlaptop
repo=~/PZ_Optimization
os=linux
pz_root=~/.local/share/Steam/steamapps/common/ProjectZomboid
game_dir=~/.local/share/Steam/steamapps/common/ProjectZomboid/projectzomboid
display_env=plasmashell
install=install.sh
run_args=--launcher direct

[dell]
# diego-dell: i5-6300HQ, GTX 960M Optimus, KDE Wayland 1920x1080, fish shell, no JDK; never Steam launches
host=diego@192.168.0.109
key=~/.ssh/id_ed25519_pzdell
repo=~/PZ_Optimization
os=linux
pz_root=~/.local/share/Steam/steamapps/common/ProjectZomboid
game_dir=~/.local/share/Steam/steamapps/common/ProjectZomboid/projectzomboid
display_env=plasmashell
install=install.sh
inhibit=true
steam_shutdown=true
run_args=--launcher direct --env __NV_PRIME_RENDER_OFFLOAD=1 --env __GLX_VENDOR_LIBRARY_NAME=nvidia

[mac]
# MacBook Pro M1 Pro, macOS, zsh, bash 3.2; copy of the repo bits (no git), harness/run-mac.sh is the runner
host=diegovillalobos@192.168.0.201
key=~/.ssh/id_ed25519_pzmac
repo=~/PZ_Optimization
os=mac
install=run-mac.sh
